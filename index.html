<!DOCTYPE html>

<head>

    <!-- Google Fonts Inter -->

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nm-bg': '#000000',
                        'nm-dark': '#001DC7',
